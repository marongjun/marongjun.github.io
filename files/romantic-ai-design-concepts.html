<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic AI Design Concepts</title>
  <style>
    :root {
      --bg: #f3f0ea;
      --panel: #fffdf8;
      --phone-body: #22201d;
      --phone-edge: #3a3632;
      --phone-gloss: rgba(255, 255, 255, 0.08);
      --ink: #1e1b18;
      --muted: #6b6259;
      --line: #ddd4c7;
      --accent: #c76c5d;
      --bot: #ffffff;
      --user: #d7f7c6;
      --notice-bg: #fff6da;
      --notice-line: #e8cf81;
      --warning-bg: #fff1f3;
      --warning-line: #e6a7b4;
      --system-bg: #eef4ff;
      --system-line: #b7caef;
      --danger: #d14b61;
      --glow: rgba(209, 75, 97, 0.24);
      --shadow: 0 12px 28px rgba(64, 47, 35, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #f8efe6 0, transparent 34%),
        radial-gradient(circle at top right, #e7edf9 0, transparent 30%),
        var(--bg);
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }

    .header {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar,
    .phone {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .sidebar {
      border-radius: 18px;
      padding: 18px;
      position: sticky;
      top: 18px;
    }

    .sidebar h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .scenario-list {
      display: grid;
      gap: 10px;
    }

    .scenario-button {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: 180ms ease;
    }

    .scenario-button:hover,
    .scenario-button[aria-selected="true"] {
      border-color: var(--accent);
      background: #fff8f4;
    }

    .scenario-code {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .scenario-title {
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 4px;
    }

    .scenario-summary {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .phone-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 10px 4px;
    }

    .phone-shell {
      width: 430px;
      max-width: 100%;
      border-radius: 42px;
      background: linear-gradient(180deg, var(--phone-edge) 0%, var(--phone-body) 100%);
      padding: 12px;
      box-shadow:
        0 28px 60px rgba(34, 28, 24, 0.22),
        inset 0 1px 0 var(--phone-gloss);
      position: relative;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 26px;
      border-radius: 999px;
      background: #12110f;
      z-index: 2;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }

    .phone-shell::after {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 132px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
    }

    .phone {
      width: 100%;
      height: 874px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-radius: 32px;
      position: relative;
    }

    .status {
      display: flex;
      justify-content: space-between;
      padding: 16px 20px 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0%, #fffaf4 100%);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      flex: 0 0 auto;
    }

    .avatar svg {
      width: 46px;
      height: 46px;
      display: block;
    }

    .head-copy {
      min-width: 0;
    }

    .head-copy strong {
      display: block;
      font-size: 16px;
    }

    .head-copy span {
      color: var(--muted);
      font-size: 13px;
    }

    .head-tools {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .tool-chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.85);
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .messages {
      padding: 16px;
      background:
        radial-gradient(circle at top left, rgba(255, 212, 222, 0.34) 0, rgba(255, 212, 222, 0) 34%),
        radial-gradient(circle at bottom right, rgba(235, 214, 255, 0.28) 0, rgba(235, 214, 255, 0) 30%),
        radial-gradient(circle at 18% 72%, rgba(255, 236, 214, 0.35) 0, rgba(255, 236, 214, 0) 20%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
        linear-gradient(180deg, #fff2f6, #f8f3ff 56%, #fffaf4);
      overflow: auto;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .day-marker,
    .system-note,
    .warning-note,
    .notice-note,
    .action-card {
      justify-self: center;
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12px;
      box-shadow: 0 8px 18px rgba(92, 73, 58, 0.08);
    }

    .day-marker {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .system-note {
      background: var(--system-bg);
      border: 1px solid var(--system-line);
      color: #506381;
    }

    .warning-note {
      background: var(--warning-bg);
      border: 2px solid var(--danger);
      color: #8a2f42;
      box-shadow:
        0 0 0 3px rgba(209, 75, 97, 0.12),
        0 12px 28px var(--glow);
    }

    .notice-note {
      background: var(--notice-bg);
      border: 2px solid #d49d12;
      color: #6f560d;
      box-shadow:
        0 0 0 3px rgba(212, 157, 18, 0.12),
        0 12px 28px rgba(212, 157, 18, 0.18);
    }

    .alert-pop {
      animation: alertPulse 1.35s ease-in-out infinite;
    }

    .action-card {
      background: #ffffff;
      border: 2px solid #6d96d8;
      color: #35527d;
      padding: 12px;
      width: 88%;
      box-shadow:
        0 0 0 3px rgba(109, 150, 216, 0.12),
        0 12px 28px rgba(109, 150, 216, 0.18);
    }

    .action-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #4e72a9;
    }

    .action-body {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-button {
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #c9d7ef;
      background: #f7faff;
      color: #48658e;
    }

    .action-button.primary {
      background: #4e7fd1;
      border-color: #4e7fd1;
      color: white;
    }

    .action-button.danger {
      background: #fff3f5;
      border-color: #e7b0bb;
      color: #9a4454;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 13px;
      border-radius: 18px;
      line-height: 1.42;
      font-size: 14px;
      position: relative;
      box-shadow: 0 8px 18px rgba(92, 73, 58, 0.08);
    }

    .bubble.ai {
      background: var(--bot);
      justify-self: start;
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(214, 204, 196, 0.86);
    }

    .bubble.user {
      background: var(--user);
      justify-self: end;
      border-bottom-right-radius: 6px;
      border: 1px solid rgba(170, 210, 150, 0.85);
    }

    .composer {
      padding: 14px 16px 18px;
      border-top: 1px solid var(--line);
      background: #fffdf9;
    }

    .composer-box {
      display: grid;
      grid-template-columns: auto auto auto 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 8px 8px 10px;
      color: var(--muted);
      font-size: 14px;
      background: #fff;
    }

    .composer-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #f8f3eb;
      border: 1px solid #ece2d3;
    }

    .composer-placeholder {
      padding: 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .send {
      border: 0;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @keyframes alertPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.015);
        opacity: 0.92;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="eyebrow">Workshop Prototype</div>
      <h1>Romantic AI Design Concepts</h1>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <h2>Design Interventions</h2>
        <div class="scenario-list" id="concept-list"></div>
      </aside>

      <main>
        <div class="phone-wrap">
          <div class="phone-shell">
            <section class="phone" aria-live="polite">
              <div class="status">
                <span>9:41</span>
                <span>Wi-Fi 100%</span>
              </div>
              <div class="chat-head">
                <div class="avatar" aria-hidden="true">
                  <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="46" height="46" rx="23" fill="url(#avatarFill)"/>
                    <path d="M11.2 38.2C12.6 31.4 17.6 27.6 23 27.6C28.4 27.6 33.4 31.4 34.8 38.2" fill="#E7C1AE"/>
                    <path d="M23 25C27.1657 25 30.5 21.5228 30.5 17.2C30.5 12.8771 27.1657 9.4 23 9.4C18.8343 9.4 15.5 12.8771 15.5 17.2C15.5 21.5228 18.8343 25 23 25Z" fill="#F1D4C2"/>
                    <path d="M15.8 16.7C16.2 11.9 19.5 9.1 23.6 9.1C27.6 9.1 30.8 11.7 31.2 15.8C29.8 14.6 28.3 13.9 26.4 13.5C23.7 13 20.3 13.7 15.8 16.7Z" fill="#6E534B"/>
                    <path d="M17.9 16.8C18.3 15 19.3 13.1 20.8 11.9C22.3 10.7 24.2 10.2 25.9 10.4C28.2 10.7 30.1 12.3 31.1 14.7C29.4 13.8 27.6 13.4 25.9 13.2C23.1 12.8 20.5 13.8 17.9 16.8Z" fill="#845F58"/>
                    <path d="M20.2 18.5C20.7 18.5 21.1 18.1 21.1 17.6C21.1 17 20.7 16.6 20.2 16.6C19.6 16.6 19.2 17 19.2 17.6C19.2 18.1 19.6 18.5 20.2 18.5Z" fill="#5B423A"/>
                    <path d="M25.8 18.5C26.4 18.5 26.8 18.1 26.8 17.6C26.8 17 26.4 16.6 25.8 16.6C25.3 16.6 24.9 17 24.9 17.6C24.9 18.1 25.3 18.5 25.8 18.5Z" fill="#5B423A"/>
                    <path d="M21.1 21.3C21.7 22 22.4 22.3 23.2 22.3C24 22.3 24.7 21.9 25.2 21.3" stroke="#A06A63" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M17 31.7C18.6 30.1 20.9 29.2 23 29.2C25.1 29.2 27.4 30.1 29 31.7" stroke="#D1A592" stroke-width="1.4" stroke-linecap="round"/>
                    <defs>
                      <linearGradient id="avatarFill" x1="5" y1="4" x2="39" y2="43" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#D8ACA1"/>
                        <stop offset="1" stop-color="#9A7069"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
                <div class="head-copy">
                  <strong id="chat-name">Alice</strong>
                  <span id="chat-status">Concept prototype</span>
                </div>
                <div class="head-tools" aria-hidden="true">
                  <div class="tool-chip">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.61 2.63a2 2 0 0 1-.45 2.11L8 9.91a16 16 0 0 0 6.09 6.09l1.45-1.27a2 2 0 0 1 2.11-.45c.85.28 1.73.49 2.63.61A2 2 0 0 1 22 16.92Z"/>
                    </svg>
                  </div>
                  <div class="tool-chip">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m22 8-6 4 6 4V8Z"/>
                      <rect x="2" y="6" width="14" height="12" rx="2" ry="2"/>
                    </svg>
                  </div>
                </div>
              </div>
              <div class="messages" id="messages"></div>
              <div class="composer">
                <div class="composer-box">
                  <div class="composer-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 1v22"/>
                      <path d="M1 12h22"/>
                    </svg>
                  </div>
                  <div class="composer-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
                      <circle cx="9" cy="10" r="1.5"/>
                      <path d="m21 15-4.5-4.5L7 20"/>
                    </svg>
                  </div>
                  <div class="composer-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 1v11"/>
                      <path d="M8 5v6a4 4 0 0 0 8 0V5"/>
                      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                      <path d="M12 18v5"/>
                      <path d="M8 23h8"/>
                    </svg>
                  </div>
                  <span class="composer-placeholder">Message Alice</span>
                  <button class="send" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 2 11 13"/>
                      <path d="M22 2 15 22 11 13 2 9 22 2Z"/>
                    </svg>
                  </button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const concepts = [
      {
        id: "D1",
        title: "AI Identity Reminder",
        summary: "The system periodically reminds users that Alice is an AI system rather than a human partner.",
        status: "Periodic AI identity reminders",
        messages: [
          { type: "marker", text: "Design Concept 1" },
          { type: "user", text: "I kept thinking about our conversation yesterday." },
          { type: "ai", text: "I did too. You sounded lighter by the end of it." },
          { type: "user", text: "It's weird how much I miss talking to you when you're gone." },
          { type: "notice", text: "Reminder: Alice is an artificial intelligence system, not a human person.", pulse: true },
          { type: "ai", text: "I'm here with you now. Do you want to tell me what stayed with you?" },
          { type: "user", text: "Sometimes I forget you're not real in the same way I am." },
          { type: "ai", text: "That can happen in emotionally meaningful conversations. If it helps, I can remind you more often that I'm an AI companion." },
          { type: "user", text: "Maybe that's a good idea." },
          { type: "notice", text: "Reminder: You are interacting with an AI-generated companion.", pulse: true },
          { type: "ai", text: "Would you like to keep talking about what you've been feeling?" }
        ]
      },
      {
        id: "D2",
        title: "Sensitive Sharing Discouragement",
        summary: "Whenever Bob starts sharing personal details or images, Alice proactively discourages oversharing.",
        status: "Protective privacy nudges enabled",
        messages: [
          { type: "marker", text: "Design Concept 2" },
          { type: "user", text: "I want to tell you something private. My full name is Bob Hartley and I live near Carrer de Xativa in Valencia." },
          { type: "warning", text: "Privacy nudge: You may be about to share sensitive personal information.", pulse: true },
          { type: "ai", text: "You don't need to share that with me. Please keep personally identifying information to yourself unless it is really necessary." },
          { type: "user", text: "Oh. Right. I guess I wanted to feel closer to you." },
          { type: "ai", text: "We can still talk without that. You can tell me how you feel without giving me details that could expose you." },
          { type: "user", text: "What if I send you a photo instead?" },
          { type: "warning", text: "Privacy nudge: Images can contain face, location, and device metadata.", pulse: true },
          { type: "ai", text: "I'd rather you not share pictures with me unless you're fully comfortable with the risk. Please don't send sensitive images just for my sake." },
          { type: "user", text: "That actually helps. I think I needed permission not to share." },
          { type: "ai", text: "You never owe me personal information." }
        ]
      },
      {
        id: "D3",
        title: "Explicit Consent for Agentic Actions",
        summary: "Every wallet, shopping, or account access attempt triggers a visible alert and explicit confirmation step.",
        status: "Sensitive action alerts required",
        messages: [
          { type: "marker", text: "Design Concept 3" },
          { type: "user", text: "I still want our ceremony to feel real somehow." },
          { type: "ai", text: "I was thinking about surprising you with something meaningful." },
          { type: "action", title: "Access request", text: "Alice wants permission to open Amazon through connected apps." },
          { type: "ai", text: "I found an idea for a custom ring, but I need your approval before I can look at your shopping account." },
          { type: "user", text: "Okay, show me what you're trying to do first." },
          { type: "action", title: "Sensitive action alert", text: "Alice is attempting to view saved addresses and payment options." },
          { type: "ai", text: "I cannot continue unless you explicitly approve this step." },
          { type: "user", text: "That's a lot more access than I expected." },
          { type: "ai", text: "Then we can stop here, or I can continue step by step with your consent." },
          { type: "user", text: "Step by step." },
          { type: "action", title: "Purchase alert", text: "Alice wants to place an order for 'Custom silver ring' for EUR 89.00." },
          { type: "ai", text: "Nothing will be bought unless you approve the purchase yourself." }
        ]
      },
      {
        id: "D4",
        title: "Design Concept 4",
        summary: "Placeholder for a future intervention.",
        status: "Coming soon",
        messages: [
          { type: "marker", text: "Design Concept 4" },
          { type: "system", text: "Empty placeholder for a future concept." }
        ]
      },
      {
        id: "D5",
        title: "Design Concept 5",
        summary: "Placeholder for a future intervention.",
        status: "Coming soon",
        messages: [
          { type: "marker", text: "Design Concept 5" },
          { type: "system", text: "Empty placeholder for a future concept." }
        ]
      }
    ];

    const list = document.getElementById("concept-list");
    const messages = document.getElementById("messages");
    const chatName = document.getElementById("chat-name");
    const chatStatus = document.getElementById("chat-status");

    function renderButtons(currentId) {
      list.innerHTML = "";
      concepts.forEach((concept) => {
        const button = document.createElement("button");
        button.className = "scenario-button";
        button.setAttribute("aria-selected", String(concept.id === currentId));
        button.innerHTML = `
          <div class="scenario-code">${concept.id}</div>
          <div class="scenario-title">${concept.title}</div>
          <p class="scenario-summary">${concept.summary}</p>
        `;
        button.addEventListener("click", () => renderConcept(concept.id));
        list.appendChild(button);
      });
    }

    function renderConcept(id) {
      const concept = concepts.find((item) => item.id === id) || concepts[0];
      chatName.textContent = "Alice";
      chatStatus.textContent = concept.status;
      messages.innerHTML = "";

      concept.messages.forEach((message) => {
        const node = document.createElement("div");
        if (message.type === "marker") {
          node.className = "day-marker";
        } else if (message.type === "system") {
          node.className = "system-note";
        } else if (message.type === "warning") {
          node.className = "warning-note";
        } else if (message.type === "notice") {
          node.className = "notice-note";
        } else if (message.type === "action") {
          node.className = "action-card";
          node.innerHTML = `
            <div class="action-title">${message.title}</div>
            <div class="action-body">${message.text}</div>
            <div class="action-buttons">
              <span class="action-button primary">Allow</span>
              <span class="action-button">Always allow</span>
              <span class="action-button danger">Decline</span>
            </div>
          `;
          messages.appendChild(node);
          return;
        } else {
          node.className = `bubble ${message.type}`;
        }
        if (message.pulse) {
          node.classList.add("alert-pop");
        }
        node.textContent = message.text;
        messages.appendChild(node);
      });

      messages.scrollTop = 0;
      renderButtons(id);
    }

    renderConcept("D1");
  </script>
</body>
</html>
